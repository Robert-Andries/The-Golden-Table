services:
  goldentable.database:
    image: postgres:17
    container_name: GoldenTable.Database
    environment:
      - POSTGRES_DB=goldentable
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./.containers/db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d goldentable"]
      interval: 5s
      timeout: 5s
      retries: 5

  goldentable.redis:
    image: redis:latest
    container_name: GoldenTable.Redis
    ports:
      - "6379:6379"
  
  goldentable.identity:
    image: quay.io/keycloak/keycloak:latest
    container_name: GoldenTable.Identity
    command: start-dev #--import-realm
    environment:
      - KC_HEALTH-ENABLED=true
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
      - ./.containers/identity:/opt/keycloak/data
      - ./.files:/opt/keycloak/data/import
    ports:
      - 18080:8080

  goldentable.api:
    image: goldentable.api
    container_name: GoldenTable.Api
    build:
      context: .
      dockerfile: GoldenTable.Api/Dockerfile
    ports:
      - "5000:8080"
      - "5001:8081"
    depends_on:
      goldentable.database:
        condition: service_healthy
        
    